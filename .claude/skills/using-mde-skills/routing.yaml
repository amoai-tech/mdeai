version: 2
mode: router-only
adaptive_memory:
  enabled: false
  rule: Do not adapt routing from memory until measured observations are reviewed by a human.
  observations_file: metrics/routing-observations.json
complexity:
  S0:
    name: trivial
    orchestration: none
    examples:
    - typo
    - known one-line docs or non-behavioral config edit
    - simple lookup
    rule: S0 is direct work with no child workflow. Any application-code behavior change is at least S1 even if it is one line.
  S1:
    name: focused
    orchestration: single-primary
    examples:
    - isolated bug
    - single module change
    - run targeted tests
  S2:
    name: multi-part
    orchestration: primary-plus-specialists
    examples:
    - UI plus API
    - Supabase-backed feature
    - small cross-stack change
  S3:
    name: system-change
    orchestration: dependency-aware
    rule: Cross-system or migration work with no S4 trigger.
    examples:
    - new workflow across schema, agent, and UI without payment/security-critical writes
    - cross-domain refactor
    - reversible multi-step migration
  S4:
    name: production-critical
    orchestration: adversarial
    precedence: S4 wins whenever any trigger below is present, even if the change is otherwise small.
    triggers:
    - payments or financial side effects
    - auth, RLS, tenant boundaries, or privilege changes
    - secrets or security controls
    - destructive or irreversible production-data changes
    - externally visible publishing with irreversible consequences
    - duplicate/retry-sensitive external side effects
    examples:
    - payment webhook idempotency
    - auth/RLS policy changes
    - destructive migration
    - publishing
    - production incident
ownership:
  router: using-mde-skills
  rule: Keep router identity separate from the execution owner; the router classifies and hands off, then exits.
  domain_rule: Domain skills support the workflow owner unless the request is narrow and domain-only.
  evidence_rule: Pure evidence gathering stays owned by research; domain skills provide subject-matter support.
route_precedence:
- certify_done
- bug_or_failure
- review_existing_diff
- evidence_only
- skill_change
- substantial_task
routing_output_schema:
  fields:
  - complexity
  - router
  - execution_owner
  - supporting
  - verifier
  - subagents
  - self_certify
  - s4_trigger
  rules:
  - router is always using-mde-skills when this router is invoked
  - execution_owner is exactly one route primary owner or null for S0 direct work
  - supporting contains only additional skills required by the contract; never repeat router, execution_owner, or verifier
  - verifier is task-verifier only when independent completion proof is required; otherwise null
  - self_certify must be false for S4
  - s4_trigger must name the explicit S4 trigger or be null
hierarchy:
  router:
  - using-mde-skills
  orchestrators:
    build: tasks
    debug: systematic-debugging
    skill_authoring: writing-skills
  reasoning:
  - research
  - domain-modeling
  - codebase-design
  - wireframe
  - mermaid-diagrams
  implementation_quality:
  - tdd
  - testing
  - lean-dev-flow
  domain:
  - mastra
  - copilotkit
  - supabase
  - gemini
  - maps
  - real-estate
  - stripe
  - nextjs
  - cloudinary
  - events
  - mde-vercel
  critics:
  - code-review
  - task-verifier
  shipping:
  - mde-worktree-pr-flow
routes:
  substantial_task:
    primary: tasks
    min_complexity: S1
  bug_or_failure:
    primary: systematic-debugging
    min_complexity: S1
  skill_change:
    primary: writing-skills
    min_complexity: S1
  review_existing_diff:
    primary: code-review
    min_complexity: S1
  certify_done:
    primary: task-verifier
    min_complexity: S2
  evidence_only:
    primary: research
    min_complexity: S1
step_contract:
  required:
  - step_id
  - skill
  - action
  - inputs
  - outputs
  - depends_on
  - can_parallel
  - on_failure
  on_failure_values:
  - retry
  - skip-with-limitation
  - reroute
  - abort
  - ask-user
parallelization:
  allow_when:
  - depends_on is empty or all dependencies are complete
  - steps do not mutate the same source of truth
  - one step does not require another step's output
  deny_when:
  - schema/API/interface contract is not yet fixed
  - steps share destructive or order-sensitive side effects
  - a security, auth, payment, or migration invariant could be invalidated by ordering
failure_policy:
  transient_network_or_rate_limit:
    action: retry
    max_attempts: 2
  optional_research_source_unavailable:
    action: skip-with-limitation
  test_failure:
    action: reroute
    target: systematic-debugging
  schema_or_runtime_contract_mismatch:
    action: abort
  security_auth_rls_failure:
    action: abort
  payment_or_duplicate_side_effect_risk:
    action: abort
  review_blocker:
    action: reroute
    target: tasks
  verifier_blocker:
    action: abort
  destructive_uncertainty:
    action: ask-user
linear_handoff:
  owner: tasks
  required_fields:
  - complexity
  - current_phase
  - completed_checkpoints
  - current_outputs
  - blockers
  - next_action
  - exact_head_sha
  - evidence
  - residual_risk
  rule: Linear is the persistent orchestration state for substantial SAN work; do not create a parallel execution-plan file
    unless the task specifically needs a design artifact.
measurement:
  before_adaptive_memory: true
  required_observation_fields:
  - timestamp
  - request_summary
  - predicted_primary
  - actual_primary
  - complexity
  - supporting_predicted
  - supporting_used
  - routing_correction
  - outcome
  - notes
