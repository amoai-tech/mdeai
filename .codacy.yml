---
# SQL dialect policy: Supabase SQL in this repository is PostgreSQL.
#
# TSQLLint is SQL Server-only and is disabled in the current Codacy Cloud configuration.
# Keep the per-tool SQL exclusion below as defense in depth if it is enabled again: T-SQL
# directives such as ANSI_NULLS and NOCOUNT are not valid PostgreSQL requirements.
#
# SQLFluff is the active SQL analyzer in Codacy Cloud. SQLint is currently disabled.
exclude_paths:
  - "scripts/pr-agent/evals/fixtures/semver-boundary-canary-source.mjs"
  - "scripts/pr-agent/evals/fixtures/semver-boundary-canary-test.mjs"

engines:
  tsqllint:
    exclude_paths:
      - "**.sql"
