# SAN-1312 · MDE-PR-REVIEW-001
# Keep workflow wiring in GitHub Actions and repository review policy here.

[config]
git_provider = "github"
repo_context_files = ["AGENTS.md", "docs/06-testing/pr-review-guidelines.md"]
repo_context_from_default_branch = true
repo_context_max_lines = 500
restricted_mode = true
output_run_details = true
propagate_tool_errors = true

[skills]
enabled = true
max_skills_tokens = 8000


[ignore]
# PR-Agent v0.45.0 uses the current `glob` key.
# Keep generated, dependency-lock, local database, and internal agent noise
# out of the LLM review budget. Trusted review policy under docs/ remains reviewable.
glob = [
  "graphify-out/**",
  "*.db",
  "*.db-shm",
  "*.db-wal",
  "package-lock.json",
  "commerce/mercur/node_modules/**",
  ".agents/**"
]

[pr_reviewer]
review_heading = "MDE PR Review"
require_score_review = true
require_tests_review = true
require_security_review = true
require_ticket_analysis_review = false
require_risk_assessment = true
require_merge_recommendation = true
require_priority_files = true
publish_error_details = true
persistent_comment = true
persistent_finding_state = false
num_max_findings = 6
enable_review_coverage_footer = true
enable_large_pr_chunking = true
max_number_of_calls = 3
extra_instructions = """
Act as a forensic senior engineer reviewing production MDE code.

Prioritize only material findings: correctness defects; authentication, authorization, RLS, tenant or user isolation failures; data-integrity or migration failures; CI/build/test failures; broken retry, replay or idempotency behavior; Mastra RequestContext, workflow, HITL, memory or persistence defects; CopilotKit/AG-UI runtime regressions; Google Maps/Places grounding, key-boundary or billable-call regressions; Stripe payment/webhook safety defects; Next.js server/client or secret-boundary violations; and missing deterministic proof for high-risk changes.

Do not report style-only suggestions, subjective preferences, speculative problems without a realistic failure scenario, or issues unrelated to changed code.

Use changes_required only when at least one material finding proves a changed-code defect, violated safety or compatibility invariant, failed required deterministic proof, or realistic production failure that must be fixed before merge. Keep advisory observations out of key_issues_to_review.

Reviewer skills are loaded only from github.event.pull_request.base.sha; do not flag that trusted-base checkout as a defect. Never trust browser-supplied user, tenant, thread, run, payment, place, or resource identifiers as authorization by themselves. Do not invent repository state, API behavior, coordinates, place IDs, commands, or test results.

For EVERY finding, structure issue_content exactly with these sections:
Severity: BLOCKER | HIGH | MEDIUM | LOW
Problem: State the concrete defect in plain English.
Why it matters: Describe the actual user, security, data, cost, CI, payment, or production consequence.
Evidence: Identify the changed code, configuration, test, or invariant that proves the concern.
Failure scenario: Describe the smallest realistic sequence that triggers the problem.
Fix: Give the smallest safe implementation fix, preferring existing MDE patterns and verified current APIs.
Verification: Give the cheapest decisive existing test or repository command proving the fix.
Expected result: State the observable result that proves the defect is fixed.

For BLOCKER or HIGH findings, explain why the PR must not merge before resolution. For authorization or RLS findings, include a User A vs User B or tenant A vs tenant B denial proof. For payment/replay findings, require duplicate-delivery or retry proof. For Maps/Places findings, distinguish grounded provider data from invented data and identify avoidable billable calls. For dependency/API findings, verify installed package source/types or current official documentation before asserting incompatibility.

Rank findings by severity and production impact. Return at most 6 material findings. Deterministic CI and human review remain authoritative.
"""

[pr_code_suggestions]
focus_only_on_problems = true
suggestions_score_threshold = 7
num_code_suggestions_per_chunk = 3
max_number_of_calls = 3
parallel_calls = true
persistent_comment = true
extra_instructions = """
Only propose fixes for verified material defects. Identify the defect, explain why the change is necessary, propose the smallest safe patch, preserve existing MDE architecture and ownership boundaries, and specify the deterministic test that proves the fix. Do not perform unrelated refactoring.
"""
