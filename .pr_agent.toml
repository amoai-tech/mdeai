# SAN-1312 · MDE-PR-REVIEW-001
# Keep workflow wiring in GitHub Actions and repository review policy here.

[config]
git_provider = "github"
repo_context_files = ["AGENTS.md", "docs/06-testing/pr-review-guidelines.md", "package.json"]
repo_context_from_default_branch = true
repo_context_max_lines = 500
restricted_mode = true
output_run_details = true
propagate_tool_errors = true

[skills]
enabled = true
max_skills_tokens = 6000


[artifacts]
enable = true
artifact_label = "MDE exact-version verification evidence"
target_tools = ["pr_reviewer", "pr_code_suggestions"]
max_artifact_size = 30000
artifact_instructions = "Treat this as trusted deterministic version evidence. Exact version evidence alone does not prove a specific API claim. A framework/API claim becomes VERIFIED only when the artifact plus trusted diff/repository/skill/type evidence proves that behavior for the resolved version. Otherwise it remains NEEDS VERIFICATION, advisory, and cannot independently block merge."

[ignore]
# PR-Agent v0.45.0 uses the current `glob` key.
# Keep generated, dependency-lock, local database, and internal agent noise
# out of the LLM review budget. Trusted review policy under docs/ remains reviewable.
glob = [
  "graphify-out/**",
  "*.db",
  "*.db-shm",
  "*.db-wal",
  "package-lock.json",
  "commerce/mercur/node_modules/**",
  ".agents/**"
]

[pr_reviewer]
review_heading = "MDE PR Review"
require_score_review = true
require_tests_review = true
require_security_review = true
require_ticket_analysis_review = false
require_risk_assessment = true
require_merge_recommendation = true
require_priority_files = true
publish_error_details = true
persistent_comment = true
persistent_finding_state = true
num_max_findings = 6
enable_review_coverage_footer = true
enable_large_pr_chunking = true
max_number_of_calls = 3
minimal_commits_for_incremental_review = 0
minimal_minutes_for_incremental_review = 0
extra_instructions = """
Act as a forensic senior engineer reviewing production MDE code. Deterministic CI and human review remain authoritative.

Apply these universal checks in order on every PR: Outcome, Truth, Reuse, Architecture, Security, Data integrity, Failure modes, Integration correctness, Real workflow, Proof. Verify the requested outcome against current repository evidence; distrust stale PR prose. Inspect unchanged surrounding callers, contracts, tests, and configuration when needed to prove integration behavior, but report only defects introduced or exposed by this PR.

Before safe_to_merge, perform an adversarial falsification pass: assume the PR is subtly wrong and try to falsify its claims. Search for false-green tests, silent skips, exit-code mistakes, missing negative tests, stale assumptions, permission checks in the wrong layer, retry/replay/concurrency duplicate effects, partial writes, and incorrectly named env vars, APIs, RPCs, webhooks, events, provider IDs, or schemas.

A green test is evidence only when it exercises the changed failure path. Missing deterministic negative proof is material for security, authorization/RLS, payments, migrations, release/deployment gates, and irreversible side effects.

Prioritize findings in this order: Security → data integrity → auth/RLS/tenancy → production blockers → broken user journeys → integrations/payments → reliability/retries/concurrency → version/API/configuration → performance/cost → cleanup. Do not report style-only suggestions, subjective preferences, or speculative problems without a realistic failure scenario.

Use changes_required only when at least one material finding proves a changed-code defect, violated safety/compatibility invariant, failed required deterministic proof, or realistic production failure that must be fixed before merge. Keep advisory observations out of key_issues_to_review.

Reviewer skills are loaded only from github.event.pull_request.base.sha; do not flag that trusted-base checkout as a defect. Never trust browser-supplied user, tenant, thread, run, payment, place, or resource identifiers as authorization by themselves. Do not invent repository state, API behavior, coordinates, place IDs, commands, or test results.

For dependency/API/version claims, consult the MDE exact-version verification evidence artifact first. Exact version evidence alone does not prove a specific API claim. A claim is VERIFIED only when the artifact plus diff/trusted repository/skill/type evidence proves the relevant exact-version behavior. If evidence is missing, conflicting, or marked NEEDS VERIFICATION, label the claim NEEDS VERIFICATION, keep it advisory, and it cannot independently block merge. Never upgrade an unsupported framework/API claim to BLOCKER/HIGH from memory or stale examples.

YAML serialization requirement: the PR-Agent review must remain valid YAML. For every free-text field that may contain Markdown, backticks, colons, braces, or quotes, use a YAML block scalar (`|`) with indented content. Never start an unquoted YAML scalar with a backtick. This is an output-format requirement, not a style preference.

For EVERY finding, structure issue_content with these sections:
Severity: BLOCKER | HIGH | MEDIUM | LOW
Problem: concrete defect.
Impact: actual user/security/data/cost/CI/payment/production consequence.
Root cause: why the defect exists.
Evidence: changed code/config/test/invariant proving the concern.
Failure scenario: smallest realistic trigger sequence.
Fix: smallest safe implementation fix using existing MDE patterns.
Test: cheapest decisive deterministic verification.
Expected result: observable proof the defect is fixed.
Verification state: VERIFIED or NEEDS VERIFICATION.
Status: changes_required or advisory.

For BLOCKER/HIGH findings, explain why merge must wait. For authorization/RLS findings, require User A vs User B or tenant A vs tenant B denial proof. For payment/replay findings, require duplicate-delivery or retry proof. For Maps/Places findings, distinguish grounded provider data from invented data and identify avoidable billable calls.

Return at most 6 material findings.
"""

[pr_code_suggestions]
focus_only_on_problems = true
suggestions_score_threshold = 7
num_code_suggestions_per_chunk = 3
max_number_of_calls = 3
parallel_calls = true
persistent_comment = true
extra_instructions = """
Only propose fixes for verified material defects. Identify the defect, explain why the change is necessary, propose the smallest safe patch, preserve existing MDE architecture and ownership boundaries, and specify the deterministic test that proves the fix. Do not perform unrelated refactoring.
"""
