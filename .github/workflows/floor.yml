# PR-16 / SAN-458 — required status check for merges to main (lint·typecheck·build·test·audit).
name: Floor

on:
  # Every pull request, whatever base it targets. Restricting this to `branches: [main]`
  # meant a stacked PR — one based on another feature branch — got no floor run at all,
  # which is precisely when its diff is least independently verified. The required check
  # for `main` is unchanged, because the job name is.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  floor:
    name: floor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Pinned to immutable commits: a repointed `@v4` tag would run other code here
      # without a single change to this repository. Same commits as the other workflows.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Migration timestamp uniqueness (PR-17)
        run: node scripts/check-migration-timestamps.mjs

      - name: Floor gates
        run: npm run floor
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          # NO SUPABASE_SERVICE_ROLE_KEY. `floor` runs on pull_request, so this job executes the
          # PR's checked-out code — scripts, configs, dependencies. Handing it a service-role key
          # (which bypasses every RLS rule) meant any same-repository PR could use production-wide
          # credentials. Nothing in the floor chain needs it: check:env:ci validates build-time
          # variables, the unit suite mocks Supabase, and live integration tests have their own
          # workflow. If a future gate genuinely needs privileged data, put it in a trusted
          # post-merge job instead of here.

  # SAN-1321 — the version contract proves the *installed* adapter is paired
  # correctly; this proves that adapter actually provisions the committed schema.
  # Without a real database a regression in the initializer would leave every
  # other gate green, which is exactly how a fresh environment ended up with only
  # 8 of 32 tables.
  mastra-schema-init:
    name: mastra-schema-init
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # SAN-1368 — make the disposable database look like Supabase (the three roles the
      # lockdown targets, plus the permissive default grants it revokes) so the required check
      # proves the full invariant, not just RLS. Without these roles the policy/grant
      # assertions in the verifier are skipped.
      - name: Seed Supabase-equivalent roles and default grants
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node scripts/seed-supabase-proof-roles.mjs

      # Disposable database: exercise the real package entry point from empty.
      - name: Provision the Mastra schema through mastra:init
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run mastra:init

      - name: Prove mastra:init is idempotent
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run mastra:init

      - name: Verify the provisioned schema matches the contract
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run check:mastra:schema:init

      # Proves the retention guards behave on a real database: stale spans expire,
      # the one-time anonymous sweep is dry-run safe, real user threads survive, and
      # a NEW anonymous thread is rejected rather than deleted.
      - name: Prove Mastra retention guards on a disposable database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MASTRA_RETENTION_INTEGRATION: "1"
        run: node --test scripts/__tests__/mastra-retention.integration.test.mjs

      # Orphan-message prevention: a late write after thread deletion must be
      # rejected (23503), deleting a thread must remove its messages, and the
      # database must end with orphanMessages=0.
      - name: Prove no late message write can orphan a thread
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MASTRA_INTEGRITY_INTEGRATION: "1"
        run: node --test scripts/__tests__/mastra-integrity.integration.test.mjs

      # SAN-1311 — the gate above proves the adapter provisions the committed schema.
      # These prove the runtime actually uses it, that a conversation written by the
      # previous version is still readable, and that a suspended workflow survives a cold
      # start. All of them write rows, so they run only in this disposable database and
      # refuse a non-loopback host by default (src/mastra/lib/integration-db-guard.ts).
      - name: Prove the runtime writes only the required tables
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MASTRA_TABLE_USAGE_INTEGRATION: "1"
        run: npx vitest run src/mastra/lib/storage-runtime-tables.integration.test.ts

      - name: Prove a previous-version conversation is still readable
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MASTRA_LEGACY_COMPAT_INTEGRATION: "1"
        run: npx vitest run src/mastra/lib/storage-legacy-compat.integration.test.ts

      - name: Prove a suspended workflow resumes after a cold start
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          VEB_MVP_010_INTEGRATION: "1"
        run: npx vitest run src/mastra/lib/storage-durability.integration.test.ts

      # Strongest storage proof: remove the optional adapter tables and re-run both
      # runtime proofs. A missing-relation error here means the upgraded runtime needs a
      # table production may not have — the failure we want before deployment, not after.
      - name: Drop the optional adapter tables
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node scripts/drop-optional-mastra-tables.mjs

      - name: Prove the runtime needs only the certified tables
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MASTRA_TABLE_USAGE_INTEGRATION: "1"
          VEB_MVP_010_INTEGRATION: "1"
        run: |
          npx vitest run src/mastra/lib/storage-runtime-tables.integration.test.ts
          npx vitest run src/mastra/lib/storage-durability.integration.test.ts

      # SAN-548 — deliberately AFTER the optional adapter tables are dropped, so this runs
      # against the production-style 32-table contract (no mastra_thread_state). A realistic
      # rental chat (12 turns, "furnished", Laureles, 2BR, 5M -> 4M) survives close -> fresh
      # PostgresStore + Memory recreation -> reload; the stale 5M does not win; User B is
      # denied through the real auth gate.
      - name: Prove rental chat memory survives a fresh store recreation
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MASTRA_CHAT_MEMORY_DURABILITY: "1"
        run: npx vitest run src/mastra/lib/chat-memory-durability.integration.test.ts

  # Codacy's hosted ESLint runners do not load our Next.js dependencies reliably.
  # Analyze with this checkout's npm ci, then upload the full Codacy-native report.
  # Fork PRs never receive the repository upload token.
  codacy-eslint:
    name: codacy-eslint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install MDE dependencies
        run: npm ci

      - name: Install pinned Codacy Analysis CLI
        run: npm install --global --ignore-scripts @codacy/analysis-cli@0.24.0

      - name: Analyze ESLint9 and reject analyzer failures
        shell: bash
        run: |
          set +e
          codacy-analysis analyze . --config-file .codacy/eslint9-ci.json --tool ESLint9 --no-log --output-format json --output "$RUNNER_TEMP/codacy-eslint.json"
          analysis_exit=$?
          set -e
          # Exit 1 can mean lint findings. Reject missing/crashed analyzers independently.
          if [ "$analysis_exit" -ne 0 ] && [ "$analysis_exit" -ne 1 ]; then
            echo "::error::Codacy analysis failed (exit $analysis_exit)"
            exit "$analysis_exit"
          fi
          node - "$RUNNER_TEMP/codacy-eslint.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const tool = report.toolResults?.find((item) => item.toolId === 'ESLint9');
          if (!tool || tool.status !== 'success' || tool.filesAnalyzed < 1 ||
              (tool.errorCount ?? 0) !== 0 || (report.errors?.length ?? 0) > 0) {
            console.error('::error::ESLint9 did not complete a valid analysis');
            process.exit(1);
          }
          console.log(`ESLint9 analyzed ${tool.filesAnalyzed} files; ${tool.issueCount} findings (including baseline).`);
          NODE

      # Codacy's documented diff mode provides the PR-only failure gate.
      # Existing full-repository findings remain visible in Codacy, but do not
      # turn every unrelated PR red until the baseline is addressed.
      - name: Reject newly introduced ESLint9 findings
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set +e
          codacy-analysis analyze . --config-file .codacy/eslint9-ci.json --tool ESLint9 --diff "$BASE_SHA" --no-log --output-format json --output "$RUNNER_TEMP/codacy-eslint-diff.json"
          analysis_exit=$?
          set -e
          node scripts/check-codacy-eslint-diff.mjs "$RUNNER_TEMP/codacy-eslint-diff.json" "$BASE_SHA" "$analysis_exit"

      - name: Preserve complete Codacy report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codacy-eslint-report
          path: ${{ runner.temp }}/codacy-eslint.json
          if-no-files-found: error
          retention-days: 1

  # Runs in a separate clean runner: PR code and npm scripts cannot access the token.
  codacy-eslint-upload:
    name: codacy-eslint-upload
    needs: codacy-eslint
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install pinned Codacy uploader
        run: npm install --global --ignore-scripts @codacy/analysis-cli@0.24.0

      - name: Download validated ESLint9 report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codacy-eslint-report
          path: ${{ runner.temp }}/codacy-upload

      - name: Send exact-commit ESLint9 results to Codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          ANALYZED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$CODACY_PROJECT_TOKEN" ]; then
            echo "::error::CODACY_PROJECT_TOKEN is required"
            exit 1
          fi
          codacy-analysis upload "$RUNNER_TEMP/codacy-upload/codacy-eslint.json" --commit "$ANALYZED_SHA"
