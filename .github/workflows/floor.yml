# PR-16 / SAN-458 — required status check for merges to main (lint·typecheck·build·test·audit).
name: Floor

on:
  # Every pull request, whatever base it targets. Restricting this to `branches: [main]`
  # meant a stacked PR — one based on another feature branch — got no floor run at all,
  # which is precisely when its diff is least independently verified. The required check
  # for `main` is unchanged, because the job name is.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  floor:
    name: floor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Pinned to immutable commits: a repointed `@v4` tag would run other code here
      # without a single change to this repository. Same commits as the other workflows.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Migration timestamp uniqueness (PR-17)
        run: node scripts/check-migration-timestamps.mjs

      - name: Floor gates
        run: npm run floor
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # SAN-1321 — the version contract proves the *installed* adapter is paired
  # correctly; this proves that adapter actually provisions the committed schema.
  # Without a real database a regression in the initializer would leave every
  # other gate green, which is exactly how a fresh environment ended up with only
  # 8 of 32 tables.
  mastra-schema-init:
    name: mastra-schema-init
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Disposable database: exercise the real package entry point from empty.
      - name: Provision the Mastra schema through mastra:init
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run mastra:init

      - name: Prove mastra:init is idempotent
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run mastra:init

      - name: Verify the provisioned schema matches the contract
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run check:mastra:schema:init
