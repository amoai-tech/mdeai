# PR-16 / SAN-458 — required status check for merges to main (lint·typecheck·build·test·audit).
name: Floor

on:
  # Every pull request, whatever base it targets. Restricting this to `branches: [main]`
  # meant a stacked PR — one based on another feature branch — got no floor run at all,
  # which is precisely when its diff is least independently verified. The required check
  # for `main` is unchanged, because the job name is.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  floor:
    name: floor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Pinned to immutable commits: a repointed `@v4` tag would run other code here
      # without a single change to this repository. Same commits as the other workflows.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Migration timestamp uniqueness (PR-17)
        run: node scripts/check-migration-timestamps.mjs

      - name: Floor gates
        run: npm run floor
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # SAN-1321 — the version contract proves the *installed* adapter is paired
  # correctly; this proves that adapter actually provisions the committed schema.
  # Without a real database a regression in the initializer would leave every
  # other gate green, which is exactly how a fresh environment ended up with only
  # 8 of 32 tables.
  mastra-schema-init:
    name: mastra-schema-init
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # SAN-1368 — make the disposable database look like Supabase (the three roles the
      # lockdown targets, plus the permissive default grants it revokes) so the required check
      # proves the full invariant, not just RLS. Without these roles the policy/grant
      # assertions in the verifier are skipped.
      - name: Seed Supabase-equivalent roles and default grants
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node scripts/seed-supabase-proof-roles.mjs

      # Disposable database: exercise the real package entry point from empty.
      - name: Provision the Mastra schema through mastra:init
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run mastra:init

      - name: Prove mastra:init is idempotent
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run mastra:init

      - name: Verify the provisioned schema matches the contract
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run check:mastra:schema:init

      # Proves the retention guards behave on a real database: stale spans expire,
      # the one-time anonymous sweep is dry-run safe, real user threads survive, and
      # a NEW anonymous thread is rejected rather than deleted.
      - name: Prove Mastra retention guards on a disposable database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MASTRA_RETENTION_INTEGRATION: "1"
        run: node --test scripts/__tests__/mastra-retention.integration.test.mjs

      # SAN-1311 — the gate above proves the adapter provisions the committed schema.
      # These prove the runtime actually uses it, that a conversation written by the
      # previous version is still readable, and that a suspended workflow survives a cold
      # start. All of them write rows, so they run only in this disposable database and
      # refuse a non-loopback host by default (src/mastra/lib/integration-db-guard.ts).
      - name: Prove the runtime writes only the required tables
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MASTRA_TABLE_USAGE_INTEGRATION: "1"
        run: npx vitest run src/mastra/lib/storage-runtime-tables.integration.test.ts

      - name: Prove a previous-version conversation is still readable
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MASTRA_LEGACY_COMPAT_INTEGRATION: "1"
        run: npx vitest run src/mastra/lib/storage-legacy-compat.integration.test.ts

      - name: Prove a suspended workflow resumes after a cold start
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          VEB_MVP_010_INTEGRATION: "1"
        run: npx vitest run src/mastra/lib/storage-durability.integration.test.ts

      # Strongest storage proof: remove the optional adapter tables and re-run both
      # runtime proofs. A missing-relation error here means the upgraded runtime needs a
      # table production may not have — the failure we want before deployment, not after.
      - name: Drop the optional adapter tables
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node scripts/drop-optional-mastra-tables.mjs

      - name: Prove the runtime needs only the certified tables
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MASTRA_TABLE_USAGE_INTEGRATION: "1"
          VEB_MVP_010_INTEGRATION: "1"
        run: |
          npx vitest run src/mastra/lib/storage-runtime-tables.integration.test.ts
          npx vitest run src/mastra/lib/storage-durability.integration.test.ts
