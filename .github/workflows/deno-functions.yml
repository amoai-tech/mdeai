# Deno gates for the Supabase Edge Functions.
#
# Why this exists: PRs #689, #690 and #692 all changed `supabase/functions/**`, and nothing in
# CI ever ran `deno check` or `deno test` against them. The Stripe SDK bump in #692
# (`esm.sh/stripe@14.21.0` -> `npm:stripe@23.0.0` with API `2026-09-30.endive`) therefore passed
# CI with zero Deno verification, and only a manual check before deploy caught that it compiled.
# `floor` runs Node/Next.js gates and typecheck; it never touches the Deno edge runtime.
#
# Scope is deliberately the payment-critical pair plus the hermetic ticket/stripe tests:
#   * `ticket-checkout` and `ticket-payment-webhook` are the money path and hold the Stripe SDK pin.
#   * The selected tests are hermetic (no live Supabase, no Stripe network, no secrets).
# Widening to every function is a follow-up: several unrelated entrypoints have pre-existing
# issues, and a gate that is red on day one for unrelated reasons teaches people to ignore it.
name: Deno edge function gates

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deno-functions.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deno-functions.yml"

concurrency:
  group: deno-functions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deno:
    name: deno check + edge tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno deps and npm resolution
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            supabase/functions/node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-

      # `--node-modules-dir=auto` is required: the edge functions import `npm:stripe@23.0.0`,
      # and without it Deno refuses to resolve the package instead of downloading it.
      - name: Typecheck the payment Edge Functions
        run: |
          deno check --node-modules-dir=auto \
            supabase/functions/ticket-checkout/index.ts \
            supabase/functions/ticket-payment-webhook/index.ts

      - name: Run hermetic ticket and Stripe edge tests
        run: |
          deno test --node-modules-dir=auto --allow-env --allow-net --allow-read \
            supabase/functions/tests/checkout-access-token_test.ts \
            supabase/functions/tests/ticket-checkout-buyer_test.ts \
            supabase/functions/tests/ticket-checkout-prepared-handler_test.ts \
            supabase/functions/tests/ticket-checkout-recovery_test.ts \
            supabase/functions/tests/ticket-payment-verification_test.ts \
            supabase/functions/tests/ticket-refund-reconciliation_test.ts \
            supabase/functions/tests/ticket-stripe-webhook-guards_test.ts
