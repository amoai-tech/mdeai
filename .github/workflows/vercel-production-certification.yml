# SAN-1330 — certify the exact staged Vercel production candidate before alias assignment.
#
# SAN-1367 canonical signal name: **Candidate Runtime Certification**.
# It proves the candidate's *runtime* only — the app boots, auth works, and one concierge turn
# completes and persists. It deliberately does NOT read mutable marketplace inventory, so it can
# never claim anything about live listings. Inventory presence is a separate, non-blocking
# signal: **Marketplace Health** (see `prod-synthetic-smoke.yml`).
name: Candidate Runtime Certification

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  contents: read
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERCEL_DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
  VERCEL_DEPLOYMENT_SHA: ${{ github.event.client_payload.git.sha }}
  VERCEL_PROJECT_ID: ${{ github.event.client_payload.project.id }}
  VERCEL_PROJECT_NAME: ${{ github.event.client_payload.project.name }}
  VERCEL_ENVIRONMENT: ${{ github.event.client_payload.environment }}

jobs:
  certify:
    # SAN-1367: this job name is deliberately identical to the commit-status context
    # (`production-certification`) published below, because the Vercel project's deployment check
    # blocks alias assignment on that exact context. It is a wire identifier, not operator copy —
    # renaming it would diverge the Actions check from the blocking status and silently detach the
    # promotion block. The canonical, operator-facing signal name is the workflow `name:` above and
    # the scoped `description` on each status publication.
    name: production-certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.project.id == 'prj_5eY5DdiVxn7hDbruTG7BrrQT1QAB' &&
      github.event.client_payload.project.name == 'mdeai'

    steps:
      # SAN-1362 — fail closed BEFORE anything fallible, so no failure path can
      # leave the candidate promotable with no certification result.
      #
      # The candidate must not be promotable until certification has actually
      # passed. Nothing here needs the repository: the SHA arrives in the dispatch
      # payload and `gh` is preinstalled, so this runs first — ahead of checkout
      # and ahead of trust-boundary validation. If either of those fails, the
      # block is already published.
      #
      # Root cause, from the candidate's own commit-status timeline — Vercel
      # released the alias while this context was still `pending`:
      #
      #   23:47:32  Vercel = pending                     (deploying)
      #   23:49:28  Vercel = pending    "Waiting for checks to complete"
      #   23:49:39  production-certification = pending
      #   23:51:42  Vercel = success                     <- alias assigned HERE
      #   23:53:00  production-certification = success   <- 78s LATER
      #
      # The project's deployment check is correctly configured
      # (`blocks: deployment-alias`, `requires: deployment-url`, timeout 900), so
      # the gap is not misconfiguration — a non-terminal `pending` simply did not
      # hold. Publishing a terminal `failure` removes the pending state entirely.
      - name: Block promotion while certification is in flight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ env.VERCEL_DEPLOYMENT_SHA }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # SAN-1367: the commit-status `context` string is an identifier, not operator-facing copy.
          # It stays `production-certification` because the Vercel project's deployment check is
          # configured to block alias assignment on exactly that context; renaming it would silently
          # detach the promotion block. The *description* is where the claim is scoped.
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=failure \
            -f context=production-certification \
            -f description="Candidate runtime certification in flight — promotion blocked" \
            -f target_url="${RUN_URL}" >/dev/null
          echo "published production-certification=failure for ${SHA}"

      - name: Checkout exact deployed commit
        uses: vercel/repository-dispatch/actions/checkout@30f760c6640485cd92f8c785ef361382555fb712 # v1

      - name: Validate Vercel candidate trust boundary
        run: |
          set -euo pipefail
          node scripts/validate-vercel-deployment-event.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Certify exact staged candidate
        id: certify
        env:
          PROD_SMOKE_BASE_URL: ${{ env.VERCEL_DEPLOYMENT_URL }}
          SMOKE_BASE_URL: ${{ env.VERCEL_DEPLOYMENT_URL }}
          PW_SKIP_WEBSERVER: "1"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e:prod-candidate-certification

      # SAN-1362 — release the block only on a proven pass. `if: always()` keeps
      # a failed certification from leaving the context stuck on the in-flight
      # `failure`, so the real result is what a re-run and the dashboard show.
      #
      # `target_url` points the status "Details" link at this run; without it the
      # failure is not diagnosable from the status list, because the candidate is
      # a throwaway URL that no longer exists once the deployment is cleaned up.
      - name: Publish certification result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ env.VERCEL_DEPLOYMENT_SHA }}
          CERTIFY_OUTCOME: ${{ steps.certify.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${CERTIFY_OUTCOME}" = "success" ]; then
            state=success
            # SAN-1367: must not be readable as "everything is healthy". Names exactly what passed
            # (runtime) and exactly what was not evaluated (marketplace inventory). GitHub caps a
            # commit-status description at 140 characters.
            description="Candidate runtime certified — promotion checks passed. Marketplace inventory not evaluated."
          else
            state=failure
            description="Candidate runtime certification failed — do not promote"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${state}" \
            -f context=production-certification \
            -f description="${description}" \
            -f target_url="${RUN_URL}" >/dev/null
          echo "published production-certification=${state} for ${SHA}"
