name: PR Agent

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: amoai-tech/pr-review-infra/.github/workflows/pr-agent.yml@901e85f5ba4dcce6b5d112ab63630a0da4bc1f1d
    with:
      evidence_title: MDE PR-Agent Evidence
    secrets:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

  smart-coverage:
    # Informational only; keeps the canonical pinned PR Agent and required Floor untouched.
    name: Smart AI coverage (advisory)
    needs: review
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: mde-smart-coverage-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Report exact-commit coverage (no PR-head code execution)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_JOB_RESULT: ${{ needs.review.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const { pathToFileURL } = require("node:url");
            const source = `${process.env.GITHUB_WORKSPACE}/scripts/pr-agent/smart-review.mjs`;
            // Fail open on feature PRs where trusted base has not yet merged
            // this module. Never import untrusted PR-head JS with write token.
            if (!fs.existsSync(source)) {
              core.notice("Smart coverage is awaiting merge into the trusted base; reporter is not yet active.");
              return;
            }
            const { buildCoverageReport, validateGeneratedJson,
              validateSnapshotReferences, COVERAGE_MARKER } = await import(pathToFileURL(source).href);
            const { parseReviewEnvelope } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/pr-agent/review-policy.mjs`).href);
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const pull_number = context.issue.number;
            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;
            const { data: current } = await github.rest.pulls.get({ ...repo, pull_number });
            if (current.base.sha !== baseSha || current.head.sha !== headSha) {
              core.notice("PR base/head changed before coverage; skipping stale snapshot.");
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, { ...repo, pull_number, per_page: 100 });
            const validations = {};
            const snapshot = new Map();
            const target = /^docs\/progress\/data\/(linear-data|pr-data|pr-files)\.json$/;
            const changed = files.filter((f) => target.test(f.filename));
            // Read only these three known JSON paths, at the exact head SHA;
            // no node_modules or PR-head executable code is installed/imported.
            const references = ["docs/progress/data/pr-data.json", "docs/progress/data/pr-files.json"];
            const load = async (path) => {
              if (snapshot.has(path)) return snapshot.get(path);
              try {
                const { data } = await github.rest.repos.getContent({ ...repo, path, ref: headSha });
                if (!data || Array.isArray(data) || data.encoding !== "base64" || data.size > 1000000) return null;
                const content = Buffer.from(data.content, "base64").toString("utf8");
                snapshot.set(path, content);
                return content;
              } catch { return null; }
            };
            for (const file of changed) {
              validations[file.filename] = file.status === "removed" ?
                { status: "unknown", reason: "deleted file" } :
                validateGeneratedJson(file.filename, await load(file.filename));
            }
            if (changed.some((file) => references.includes(file.filename))) {
              const relationship = validateSnapshotReferences(await load(references[0]), await load(references[1]));
              if (relationship.status === "failed") {
                for (const file of changed) {
                  if (references.includes(file.filename)) validations[file.filename] = relationship;
                }
              } else if (relationship.status === "unknown") {
                core.info(`Cross-file references unverified: ${relationship.reason}`);
              }
            }
            const comments = await github.paginate(github.rest.issues.listComments,
              { ...repo, issue_number: pull_number, per_page: 100 });
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: context.runId });
            const start = Date.parse(run.run_started_at);
            const matching = comments.filter((comment) => {
              if (comment.user?.login !== "github-actions[bot]" || Date.parse(comment.updated_at) < start) return false;
              const envelope = parseReviewEnvelope(comment.body ?? "");
              return envelope.valid && envelope.baseSha === baseSha && envelope.headSha === headSha;
            }).sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at));
            const report = buildCoverageReport({ repo: `${repo.owner}/${repo.repo}`, number: pull_number,
              baseSha, headSha, files, expectedCount: current.changed_files,
              reviewBody: matching[0]?.body ?? "", reviewJobResult: process.env.REVIEW_JOB_RESULT,
              validations });
            const { data: latest } = await github.rest.pulls.get({ ...repo, pull_number });
            if (latest.base.sha !== baseSha || latest.head.sha !== headSha) {
              core.notice("PR changed during analysis; suppressing stale coverage comment.");
              return;
            }
            const previous = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" && (comment.body ?? "").startsWith(COVERAGE_MARKER));
            if (previous) {
              if (previous.body !== report.body) await github.rest.issues.updateComment({
                ...repo, comment_id: previous.id, body: report.body });
            } else {
              await github.rest.issues.createComment({ ...repo, issue_number: pull_number, body: report.body });
            }
            core.info(`Advisory smart coverage: ${report.status} ${JSON.stringify(report.counts)}`);
            for (const file of report.criticalPending.slice(0, 12)) {
              core.warning(`Unconfirmed AI review for ${file.category}: ${file.path}`);
            }
