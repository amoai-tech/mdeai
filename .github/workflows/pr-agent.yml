name: PR Agent

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted repository files for PR-Agent skills
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Read changed filenames
        id: changed-files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            core.setOutput("files", JSON.stringify(files.map((file) => file.filename)));

      - name: Select trusted MDE review skills
        id: reviewer-skills
        shell: bash
        env:
          CHANGED_FILES_JSON: ${{ steps.changed-files.outputs.files }}
        run: |
          if [[ -f scripts/select-pr-agent-skills.mjs ]]; then
            node scripts/select-pr-agent-skills.mjs >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rollout bootstrap only: this PR adds the trusted routing script, but the
          # base-SHA checkout cannot execute code that is not trusted on main yet.
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          const files = JSON.parse(process.env.CHANGED_FILES_JSON ?? "[]");
          if (!files.includes("scripts/select-pr-agent-skills.mjs")) {
            throw new Error("trusted PR-Agent routing script missing from base branch");
          }
          const trusted = [
            "code-review",
            "copilotkit-review",
            "mastra-review",
            "supabase-review",
            "maps-review",
            "stripe-review",
          ];
          console.log("enabled=true");
          console.log(`paths=${JSON.stringify(trusted.map((skill) => `/github/workspace/.claude/skills/${skill}`))}`);
          console.log("max_tokens=6000");
          NODE

      - name: Review pull request
        uses: docker://pragent/pr-agent@sha256:548b760b81ab4b3f729182428695ccc1194bbf87528c2b1e2b2b07e5223af7b6 # v0.45.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_NIM_API_BASE: "https://integrate.api.nvidia.com/v1"
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          config.model: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
          config.fallback_models: '["nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b"]'
          config.custom_model_max_tokens: "32000"
          config.propagate_tool_errors: "true"
          skills.enabled: ${{ steps.reviewer-skills.outputs.enabled }}
          skills.paths: ${{ steps.reviewer-skills.outputs.paths }}
          skills.max_skills_tokens: ${{ steps.reviewer-skills.outputs.max_tokens }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review -i"]'
