name: PR Agent

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The review model is a 550B-parameter endpoint (see config.model below) and
    # `publish_output_no_suggestions` still sends the full diff. At a 10-minute cap
    # a large PR is cancelled mid-review, which surfaces as a red `review` check
    # even though nothing is wrong with the code under review — PR #82 was
    # cancelled at 10m13s and PR #81 failed at 4m28s on the same class of run.
    # Repeated re-runs "fix" it only by luck. Give the job room to finish instead.
    timeout-minutes: 25
    outputs:
      review_command: ${{ steps.review-mode.outputs.review_command }}

    steps:
      - name: Checkout trusted repository files for PR-Agent skills
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Read changed filenames
        id: changed-files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            core.setOutput("files", JSON.stringify(files.map((file) => file.filename)));

      - name: Checkout PR head lockfile as untrusted data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr-agent-head
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build trusted PR-Agent evidence
        shell: bash
        env:
          CHANGED_FILES_JSON: ${{ steps.changed-files.outputs.files }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .pr-agent
          if [[ -f scripts/pr-agent/build-evidence.mjs ]]; then
            if [[ ! -s .pr-agent-head/package-lock.json ]]; then
              echo "PR head package-lock.json missing or empty; using advisory evidence" >&2
              printf '# MDE PR-Agent Evidence\n\nVersion evidence: **NEEDS VERIFICATION**\nAPI claim default: **NEEDS VERIFICATION**\nBase SHA: `%s`\nHead SHA: `%s`\n\nPR head package-lock.json missing or empty; framework/API claims are advisory only.\n' \
                "$BASE_SHA" "$HEAD_SHA" > .pr-agent/evidence.md
            elif ! node scripts/pr-agent/build-evidence.mjs \
              --base-lock package-lock.json \
              --head-lock .pr-agent-head/package-lock.json \
              --base-sha "$BASE_SHA" \
              --head-sha "$HEAD_SHA" \
              --changed-files "$CHANGED_FILES_JSON" \
              --output .pr-agent/evidence.md; then
              printf '# MDE PR-Agent Evidence\n\nVersion evidence: **NEEDS VERIFICATION**\nAPI claim default: **NEEDS VERIFICATION**\nBase SHA: `%s`\nHead SHA: `%s`\n\nEvidence generation failed; framework/API claims are advisory only.\n' \
                "$BASE_SHA" "$HEAD_SHA" > .pr-agent/evidence.md
            fi
          else
            if [[ "$CHANGED_FILES_JSON" != *"scripts/pr-agent/build-evidence.mjs"* ]]; then
              echo "trusted PR-Agent evidence builder missing from base branch" >&2
              exit 1
            fi
            printf '# MDE PR-Agent Evidence\n\nVersion evidence: **NEEDS VERIFICATION**\nAPI claim default: **NEEDS VERIFICATION**\nBase SHA: `%s`\nHead SHA: `%s`\n\nRollout bootstrap: trusted-base evidence builder is not available yet. Framework/API claims are advisory only.\n' \
              "$BASE_SHA" "$HEAD_SHA" > .pr-agent/evidence.md
          fi
          test -s .pr-agent/evidence.md
          grep -Fq "Base SHA: \`$BASE_SHA\`" .pr-agent/evidence.md
          grep -Fq "Head SHA: \`$HEAD_SHA\`" .pr-agent/evidence.md

      - name: Select full or incremental review from certified base context
        id: review-mode
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANGED_FILES_JSON: ${{ steps.changed-files.outputs.files }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const { pathToFileURL } = require("url");
            const policyPath = `${process.env.GITHUB_WORKSPACE}/scripts/pr-agent/review-policy.mjs`;
            let selectReviewCommand;
            if (fs.existsSync(policyPath)) {
              ({ selectReviewCommand } = await import(pathToFileURL(policyPath).href));
            } else {
              const changedFiles = JSON.parse(process.env.CHANGED_FILES_JSON ?? "[]");
              if (!changedFiles.includes("scripts/pr-agent/review-policy.mjs")) {
                core.setFailed("trusted PR-Agent review policy missing from base branch");
                return;
              }
              // Rollout bootstrap: after this PR merges the trusted-base module is used.
              selectReviewCommand = ({ action, certificationBodies, baseSha }) => {
                if (action !== "synchronize") return "/review";
                const marker = `<!-- mde-pr-agent-cert base=${baseSha.toLowerCase()} head=`;
                return certificationBodies.some((body) => (body ?? "").includes(marker))
                  ? "/review -i"
                  : "/review";
              };
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const reviewCommand = selectReviewCommand({
              action: context.payload.action,
              certificationBodies: comments
                .filter((comment) => comment.user?.login === "github-actions[bot]")
                .map((comment) => comment.body ?? ""),
              baseSha: context.payload.pull_request.base.sha,
            });
            core.info(`PR-Agent review command: ${reviewCommand}`);
            core.setOutput("review_command", reviewCommand);
            core.setOutput("push_commands", JSON.stringify([reviewCommand]));

      - name: Select trusted MDE review skills
        id: reviewer-skills
        shell: bash
        env:
          CHANGED_FILES_JSON: ${{ steps.changed-files.outputs.files }}
        run: |
          if [[ -f scripts/select-pr-agent-skills.mjs ]]; then
            node scripts/select-pr-agent-skills.mjs >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rollout bootstrap only: this PR adds the trusted routing script, but the
          # base-SHA checkout cannot execute code that is not trusted on main yet.
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          const files = JSON.parse(process.env.CHANGED_FILES_JSON ?? "[]");
          if (!files.includes("scripts/select-pr-agent-skills.mjs")) {
            throw new Error("trusted PR-Agent routing script missing from base branch");
          }
          const trusted = [
            "code-review",
            "copilotkit-review",
            "mastra-review",
            "supabase-review",
            "maps-review",
            "stripe-review",
          ];
          console.log("enabled=true");
          console.log(`paths=${JSON.stringify(trusted.map((skill) => `/github/workspace/.claude/skills/${skill}`))}`);
          console.log("max_tokens=6000");
          NODE

      - name: Review pull request
        uses: docker://pragent/pr-agent@sha256:548b760b81ab4b3f729182428695ccc1194bbf87528c2b1e2b2b07e5223af7b6 # v0.45.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATH: ".pr-agent/evidence.md"
          ARTIFACT_INSTRUCTIONS: "Use this trusted artifact as exact-version evidence, not standalone API proof. A framework/API claim is VERIFIED only when trusted diff/repository/skill/type evidence also proves the behavior; otherwise keep it NEEDS VERIFICATION, advisory, and non-blocking."
          NVIDIA_NIM_API_BASE: "https://integrate.api.nvidia.com/v1"
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          config.model: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
          config.fallback_models: '["nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b"]'
          config.custom_model_max_tokens: "32000"
          config.propagate_tool_errors: "true"
          skills.enabled: ${{ steps.reviewer-skills.outputs.enabled }}
          skills.paths: ${{ steps.reviewer-skills.outputs.paths }}
          skills.max_skills_tokens: ${{ steps.reviewer-skills.outputs.max_tokens }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: ${{ steps.review-mode.outputs.push_commands }}
  verify-review-result:
    name: verify-review-result
    needs: review
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted PR-Agent verification policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Require a fresh base-aware PR-Agent review result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_COMMAND: ${{ needs.review.outputs.review_command }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const { pathToFileURL } = require("url");
            const policyPath = `${process.env.GITHUB_WORKSPACE}/scripts/pr-agent/review-policy.mjs`;
            let verifyReviewResult;
            let appendCertification;
            const certHistoryMarker = "<!-- mde-pr-agent-cert-history -->";
            if (fs.existsSync(policyPath)) {
              ({ verifyReviewResult, appendCertification } = await import(pathToFileURL(policyPath).href));
            } else {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, per_page: 100,
              });
              if (!files.some((file) => file.filename === "scripts/pr-agent/review-policy.mjs")) {
                core.setFailed("trusted PR-Agent review policy missing from base branch");
                return;
              }
              const sameBase = (body, baseSha) =>
                (body ?? "").includes(`<!-- mde-pr-agent-cert base=${baseSha.toLowerCase()} head=`);
              verifyReviewResult = ({ comments, startedAt, reviewCommand, baseSha }) => {
                const marker = reviewCommand === "/review -i"
                  ? "<!-- pr-agent:review:incremental -->"
                  : "<!-- pr-agent:review:full -->";
                const priorSameBase = comments.some((comment) =>
                  comment.user?.login === "github-actions[bot]" &&
                  new Date(comment.updated_at).getTime() < startedAt &&
                  sameBase(comment.body, baseSha));
                const ok = comments.some((comment) => {
                  if (comment.user?.login !== "github-actions[bot]" ||
                      new Date(comment.updated_at).getTime() < startedAt) return false;
                  const body = comment.body ?? "";
                  const canonical = body.includes(marker);
                  const standalone = body.includes("## Standalone PR Review") &&
                    body.includes("PR-Agent could not safely update the persistent review") &&
                    body.includes("## MDE PR Review");
                  const skipped = reviewCommand === "/review -i" && priorSameBase &&
                    body.includes("Incremental Review Skipped") &&
                    body.includes("No files were changed since the previous PR Review");
                  return canonical || standalone || skipped;
                });
                return { ok };
              };
              appendCertification = (body, { baseSha, headSha }) => {
                const marker = `<!-- mde-pr-agent-cert base=${baseSha.toLowerCase()} head=${headSha.toLowerCase()} -->`;
                if ((body ?? "").includes(marker)) return body;
                const prefix = (body ?? "").includes(certHistoryMarker)
                  ? body.trimEnd()
                  : `${certHistoryMarker}\nPR-Agent certified review contexts:`;
                return `${prefix}\n${marker}\n`;
              };
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId,
            });
            const startedAt = new Date(run.run_started_at).getTime();
            const maxAttempts = 10;
            let comments = [];
            let result = { ok: false };
            for (let attempt = 1; attempt <= maxAttempts && !result.ok; attempt += 1) {
              comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100,
              });
              result = verifyReviewResult({
                comments,
                startedAt,
                reviewCommand: process.env.REVIEW_COMMAND || "/review",
                baseSha: context.payload.pull_request.base.sha,
              });
              if (!result.ok && attempt < maxAttempts) {
                core.info(`PR-Agent review not visible yet; retrying (${attempt}/${maxAttempts})`);
                await new Promise((resolve) => setTimeout(resolve, 10000));
              }
            }
            if (!result.ok) {
              core.setFailed("PR-Agent did not publish a fresh review valid for the current base context");
              return;
            }
            const existing = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" && (comment.body ?? "").includes(certHistoryMarker));
            const body = appendCertification(existing?.body ?? "", {
              baseSha: context.payload.pull_request.base.sha,
              headSha: context.payload.pull_request.head.sha,
            });
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
            }
