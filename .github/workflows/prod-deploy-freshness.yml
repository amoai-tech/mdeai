# SAN-1360 / MDE-DEPLOY-003 — post-merge production freshness guard.
#
# This deliberately does NOT listen for `vercel.deployment.success`. When production
# deployments stop flowing, that repository_dispatch is never sent, so a check that
# waits for it can never fire — which is exactly how production silently drifted 148
# commits behind while this project's smoke workflow stayed green.
#
# Driven by the GitHub push itself, so it still runs when Vercel deploys nothing.
# Not a required status check: it runs after the merge and exists to make a missing or
# stuck deployment fail visibly.
#
# Back-to-back merges: Vercel promotes the newest commit and marks the previous
# production deployment `inactive`, so the older commit can never have its own READY
# deployment even though its code ships inside the newer one. This job accepts that only
# when the *current* main commit has its own READY native Git production deployment, so a
# genuinely stuck pipeline still fails.
name: Prod deploy freshness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Fixed window, not an input: a caller-supplied value could weaken the check, and
  # the commit under test is always recent, so 15 minutes is sufficient.
  WINDOW_SECONDS: "900"

jobs:
  freshness:
    name: prod serves merge SHA
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Require a READY production deployment for the exact commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Fail on configuration, not on a confusing API response or an
          # `unbound variable` abort from `set -u`.
          missing=0
          for name in VERCEL_TOKEN VERCEL_PROJECT_ID VERCEL_ORG_ID GITHUB_TOKEN TARGET_SHA WINDOW_SECONDS; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "::error::$name is not set. VERCEL_ORG_ID is a repository variable; VERCEL_TOKEN and VERCEL_PROJECT_ID are repository secrets; TARGET_SHA is github.sha."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          SHORT=$(printf '%s' "$TARGET_SHA" | cut -c1-9)
          echo "requiring production to serve $TARGET_SHA within $WINDOW_SECONDS s"

          # One verdict per SHA. Prints "<verdict> <details>":
          # READY | PENDING | FAILED | absent | api_error.
          # Returns 0 when parsed, 1 on a fatal HTTP answer, 2 when it should be retried.
          verdict_for_sha() {
            sha="$1"
            if ! resp=$(curl --silent --show-error --write-out '\n%{http_code}' \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v7/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&sha=$sha"); then
              echo "transient curl failure"
              return 2
            fi
            status=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            case "$status" in
              200)
                # Two things this deliberately gets right:
                #
                # 1. A SHA can have several production deployments — one per retry. A single
                #    failed attempt must not mask a successful one, so match the whole set and
                #    prefer READY.
                # 2. Native automatic Git deploys must have BOTH source=git and the exact
                #    githubCommitSha. CLI/redeploy/import attempts can carry Git metadata too, so
                #    metadata alone is not enough to prove the production pipeline worked.
                printf '%s' "$body" | SHA="$sha" node -e '
                  const fs = require("fs");
                  let data;
                  try {
                    data = JSON.parse(fs.readFileSync(0, "utf8"));
                  } catch {
                    console.log("api_error gitDeployments=unparsable cliFallback=?");
                    process.exit(0);
                  }
                  const sha = process.env.SHA;
                  const prod = (data.deployments || []).filter((d) => d.target === "production");
                  const git = prod.filter((d) => d.source === "git" && (d.meta || {}).githubCommitSha === sha);
                  const fallback = prod.filter((d) => d.source !== "git" && ((d.meta || {}).githubCommitSha === sha || (d.meta || {}).gitCommitSha === sha));
                  const states = git.map((d) => d.readyState);
                  const inFlight = ["BUILDING", "QUEUED", "INITIALIZING"];
                  let verdict = "absent";
                  if (states.includes("READY")) verdict = "READY";
                  else if (states.some((s) => inFlight.includes(s))) verdict = "PENDING";
                  else if (states.length) verdict = "FAILED";
                  console.log(verdict + " gitDeployments=" + (states.length ? states.join("/") : "none") + " cliFallback=" + fallback.length);
                '
                return 0
                ;;
              401|403)
                echo "auth HTTP $status: $(printf '%s' "$body" | head -c 200)"
                return 1
                ;;
              429|5??)
                echo "transient HTTP $status"
                return 2
                ;;
              *)
                echo "fatal HTTP $status: $(printf '%s' "$body" | head -c 200)"
                return 1
                ;;
            esac
          }

          deadline=$(( $(date +%s) + WINDOW_SECONDS ))
          while :; do
            out="not checked"
            verdict="transient"
            newer_sha=""

            if out=$(verdict_for_sha "$TARGET_SHA"); then
              verdict=$(printf '%s' "$out" | cut -d' ' -f1)
              echo "$(date -u +%H:%M:%S) sha=$SHORT $out"
              if [ "$verdict" = "READY" ]; then
                echo "production is serving $TARGET_SHA from a native Git deployment"
                exit 0
              fi
              if [ "$verdict" = "api_error" ]; then
                echo "::error::Vercel returned HTTP 200 with an invalid deployment payload ($out)"
                exit 1
              fi
            else
              rc=$?
              if [ "$rc" -eq 1 ]; then
                echo "::error::the Vercel API rejected the request; cannot verify production"
                exit 1
              fi
              echo "$(date -u +%H:%M:%S) vercel query failed; retrying"
            fi

            # Accept a superseded commit only when the newer main commit is itself deployed.
            if main_out=$(curl --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main"); then
              newer_sha=$(printf '%s' "$main_out" | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d;}).on("end",()=>{try{console.log(JSON.parse(s).sha||"");}catch{console.log("");}});')
            fi
            if [ -n "$newer_sha" ] && [ "$newer_sha" != "$TARGET_SHA" ]; then
              if newer_out=$(verdict_for_sha "$newer_sha"); then
                newer_verdict=$(printf '%s' "$newer_out" | cut -d' ' -f1)
                NEWER_SHORT=$(printf '%s' "$newer_sha" | cut -c1-9)
                echo "$(date -u +%H:%M:%S) superseded by $NEWER_SHORT: $newer_out"
                if [ "$newer_verdict" = "READY" ]; then
                  # A moved main SHA is not proof of ancestry (force-pushes/rewinds).
                  # Only suppress the old run when GitHub confirms its commit is
                  # the merge base of the newer READY commit.
                  if compare_out=$(curl --silent --show-error --fail-with-body --max-time 15 \
                    -H "Authorization: Bearer $GITHUB_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$TARGET_SHA...$newer_sha"); then
                    ancestry=$(printf '%s' "$compare_out" | ORIGINAL="$TARGET_SHA" CURRENT="$newer_sha" node -e '
                      let raw = "";
                      process.stdin.on("data", (chunk) => { raw += chunk; });
                      process.stdin.on("end", () => {
                        try {
                          const compare = JSON.parse(raw);
                          if (compare.status === "ahead" &&
                              compare.merge_base_commit?.sha === process.env.ORIGINAL &&
                              compare.head_commit?.sha === process.env.CURRENT) {
                            console.log("ancestor");
                          }
                        } catch { /* Malformed GitHub response must fail closed. */ }
                      });
                    ')
                    if [ "$ancestry" = "ancestor" ]; then
                      echo "production serves the newer main commit $newer_sha, which contains $TARGET_SHA; this run is superseded"
                      exit 0
                    fi
                    echo "::warning::newer deployed main commit is not proven to contain $TARGET_SHA; keeping freshness check active"
                  else
                    echo "::warning::GitHub commit comparison failed; cannot safely suppress this run"
                  fi
                fi
              fi
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no native Git production deployment for $TARGET_SHA became READY within $WINDOW_SECONDS s ($out). Neither this commit nor a newer main commit is deployed — check the Vercel Git integration."
              exit 1
            fi
            sleep 30
          done
