name: Maps Skill Maintenance

on:
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "strict fails on any non-OK result; advisory tolerates only external unavailability"
        type: choice
        options:
          - strict
          - advisory
        default: strict
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/maps-skill-maintenance.yml"
      - ".claude/skills/maps/**"
      - "src/**/maps/**"
      - "src/**/places/**"
      - "src/**/*map*.ts"
      - "src/**/*map*.tsx"
      - "src/**/*Map*.ts"
      - "src/**/*Map*.tsx"
      - "src/**/*places*.ts"
      - "src/**/*places*.tsx"
      - "src/**/*place*.ts"
      - "src/**/*place*.tsx"
      - "src/__tests__/maps-*.test.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # PR-critical. Deterministic and local — must never depend on external availability.
  maps-contracts:
    name: deterministic Maps contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify installed React Maps API contract
        run: node .claude/skills/maps/scripts/check-visgl-compatibility.mjs
      - name: Maps maintenance contracts
        run: npx vitest run src/__tests__/maps-*.test.ts src/components/maps/google-places-summary.test.tsx

  # Live external checks. They do not run on pull requests at all, so they can never
  # block a PR (SAN-1351 Step 3). On schedule/manual runs the scripts classify each
  # result and decide the exit code themselves, so confirmed drift genuinely fails —
  # there is deliberately no blanket `continue-on-error` here, which previously made
  # the weekly drift alarm unable to fail even on a confirmed broken reference.
  maps-live-maintenance:
    if: github.event_name != 'pull_request'
    name: live upstream and link drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAPS_CHECK_MODE: ${{ inputs.mode || 'strict' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Google Maps agent-skill upstream drift
        run: node .claude/skills/maps/scripts/check-google-maps-upstream.mjs
      - name: Primary Maps reference link health
        run: node .claude/skills/maps/scripts/check-maps-reference-links.mjs
