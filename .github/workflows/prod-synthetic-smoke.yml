# UX-034 / SAN-322 — synthetic prod smoke.
#
# SAN-1330 — this workflow is now the *pre-promotion* certification gate.
#
# `vercel.deployment.success` means "finished building AND has automatically been
# promoted to production", so a workflow on that event always runs *after* the
# release. Deployment Checks need `vercel.deployment.ready` instead — "finished
# building, but has NOT been promoted" — and a commit status published with
# `vercel/repository-dispatch/actions/status@v1`. Vercel then holds the alias
# until the status is green.
#
#   repository_dispatch (production) → certify the staged deployment URL
#   schedule / workflow_dispatch     → certify the live production domain
#
# Staged deployment URLs are SSO-protected (`ssoProtection:
# all_except_custom_domains`), so pre-promotion checks present the Vercel
# automation bypass. Without it the gate fails loudly rather than quietly
# passing — a skipped certification must never look like a passed one.
name: Prod synthetic smoke

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

run-name: Prod certification (${{ github.event_name }})

permissions:
  contents: read
  actions: read
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prod-smoke:
    name: prod 4-query smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A production dispatch must ALWAYS start this job: the
    # `production-certification` status is published by a step below, so gating
    # the whole job on PROD_SMOKE_ENABLED meant a missing or misspelled variable
    # skipped certification entirely and left a required Vercel Deployment Check
    # permanently unresolved, with no explanation.
    if: ${{ (github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'production') || (github.event_name != 'repository_dispatch' && vars.PROD_SMOKE_ENABLED == 'true') }}

    steps:
      # Publishes the `production-certification` commit status for the dispatched
      # SHA from its post step, based on the final workflow outcome. Must be an
      # early step, and only for repository_dispatch (one status per deployment).
      # Pinned to the commit `v1` resolves to, matching the checkout action below.
      # A movable tag on a third-party action is a supply-chain risk: whoever
      # controls the tag controls code that runs with `statuses: write`.
      - name: Publish deployment certification status
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          name: production-certification
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Fail loudly rather than certifying nothing. Without this, a dispatch with
      # PROD_SMOKE_ENABLED unset would publish no usable certification.
      - name: Validate production smoke configuration
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          PROD_SMOKE_ENABLED: ${{ vars.PROD_SMOKE_ENABLED }}
        run: |
          if [ "${PROD_SMOKE_ENABLED}" != "true" ]; then
            echo "::error::PROD_SMOKE_ENABLED must be exactly 'true' for production dispatches (got '${PROD_SMOKE_ENABLED}')."
            echo "::error::Set it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - name: Checkout deployed commit
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: vercel/repository-dispatch/actions/checkout@30f760c6640485cd92f8c785ef361382555fb712 # v1

      - name: Checkout main
        if: ${{ github.event_name != 'repository_dispatch' }}
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # SAN-1330 — a misclassified public variable cannot be caught from the
      # build alone: Vercel stores NEXT_PUBLIC_* as Secret/Sensitive, compiles it
      # into the client bundle as `undefined`, and still reports READY. Inspect
      # the project's env *metadata* before certifying anything.
      #
      # Runs before `npm ci` because the script needs only Node built-ins. A
      # missing VERCEL_TOKEN fails here rather than silently skipping the gate.
      - name: Verify Vercel public-variable contract
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/check-vercel-env-contract.mjs --project mdeai --scope amo1000

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve certification target
        id: target
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            # Certify the staged deployment, which is NOT yet on the custom domain.
            url="${{ github.event.client_payload.url }}"
            sha="${{ github.event.client_payload.git.sha }}"
            if [ -z "${BYPASS}" ]; then
              echo "::error::repository_dispatch fired but VERCEL_AUTOMATION_BYPASS_SECRET is not configured."
              echo "::error::Deployment URLs are SSO-protected, so the staged deployment cannot be certified without the automation bypass."
              echo "::error::Vercel → project Settings → Deployment Protection → Protection Bypass for Automation; store it as the GitHub secret VERCEL_AUTOMATION_BYPASS_SECRET."
              exit 1
            fi
          else
            url="${{ vars.PROD_SMOKE_BASE_URL }}"
            sha="${GITHUB_SHA}"
          fi
          test -n "${url}" || { echo "::error::No certification target URL resolved"; exit 1; }
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "certifying ${url} at ${sha}"

      - name: Verify production runtime contract
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          INFO_JSON: ${{ runner.temp }}/copilotkit-info.json
        run: |
          set -euo pipefail
          curl_args=(--silent --show-error --location)
          if [ -n "${BYPASS}" ]; then
            curl_args+=(-H "x-vercel-protection-bypass: ${BYPASS}")
          fi

          for path in / /events; do
            code=$(curl "${curl_args[@]}" --output /dev/null --write-out '%{http_code}' "${TARGET_URL}${path}")
            test "$code" = "200" || { echo "::error::${path} returned ${code}, expected 200"; exit 1; }
          done

          # /api/copilotkit/info is POST-only. A GET is *correctly* rejected with 405
          # (Allow: POST), so "not 5xx" was never a health signal: a 404 (route missing)
          # or a 403 would have passed it just as happily.
          #
          # Assert the actual contract instead:
          #   1. GET  -> exactly 405 with Allow: POST  (protocol enforcement intact)
          #   2. POST -> exactly 200, and the body must prove the runtime booted with the
          #              pinned CopilotKit version and every expected agent registered.
          get_code=$(curl "${curl_args[@]}" --output /dev/null --write-out '%{http_code}' "${TARGET_URL}/api/copilotkit/info")
          test "$get_code" = "405" || { echo "::error::GET /api/copilotkit/info returned ${get_code}, expected 405"; exit 1; }

          post_code=$(curl "${curl_args[@]}" --write-out '%{http_code}' \
            --output "${RUNNER_TEMP}/copilotkit-info.json" \
            -X POST "${TARGET_URL}/api/copilotkit/info" \
            -H "Content-Type: application/json" -d '{"method":"info"}')
          test "$post_code" = "200" || { echo "::error::POST /api/copilotkit/info returned ${post_code}, expected 200"; exit 1; }

          node -e '
            const info = require(process.env.INFO_JSON);
            const expected = ["pingAgent", "conciergeAgent", "hostEventAgent", "hostOpsAgent"];
            if (info.version !== "1.55.2") {
              throw new Error(`unexpected CopilotKit version: ${info.version}`);
            }
            const missing = expected.filter((a) => !info.agents || !info.agents[a]);
            if (missing.length) {
              throw new Error(`runtime is missing agents: ${missing.join(", ")}`);
            }
            console.log(`copilotkit info ok: v${info.version}, agents ${Object.keys(info.agents).join(", ")}`);
          '

      - name: Run prod synthetic smoke
        env:
          PROD_SMOKE_BASE_URL: ${{ steps.target.outputs.url }}
          SMOKE_BASE_URL: ${{ steps.target.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PROD_SMOKE_OUT_DIR: ${{ github.workspace }}/tmp/prod-synthetic-smoke
          PW_SKIP_WEBSERVER: "1"
        run: npm run test:e2e:prod-synthetic

      - name: Run full production journey on manual certification
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PROD_SMOKE_BASE_URL: ${{ steps.target.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_SKIP_WEBSERVER: "1"
        run: npm run test:e2e:prod-journey-j05-j20

      # SAN-1314 — live signed-in proof. Runs even when the concierge synthetic
      # smoke above fails, because a broken map panel must not hide whether
      # authenticated users can still reach protected routes.
      - name: Verify signed-out and signed-in protected route behavior
        if: always()
        env:
          PROD_SMOKE_BASE_URL: ${{ steps.target.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PW_SKIP_WEBSERVER: "1"
        run: |
          npx playwright test e2e/prod-signed-in-route.spec.ts --project=chromium --workers=1

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-synthetic-smoke-${{ github.run_id }}
          path: tmp/prod-synthetic-smoke/**
          if-no-files-found: ignore
