# SAN-1366 / SAN-1367 — Production Runtime Smoke (4 verticals + artifacts).
#
# Canonical signal name: **Production Runtime Smoke**. It asserts that each vertical's chat
# results reach a valid rendered terminal state — result cards, or the vertical's own explicit
# empty state. It does NOT assert that live inventory exists: zero published listings is a valid
# product state and is reported separately as **Marketplace Health**, which never gates this job.
#
# Before SAN-1366 this job asserted `count() > 0` on four verticals, so a healthy app with an
# empty marketplace was reported as a broken app on every run from 2026-09-28.
name: Production Runtime Smoke

on:
  repository_dispatch:
    types:
      - vercel.deployment.promoted
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  runtime-smoke:
    name: Production Runtime Smoke
    runs-on: ubuntu-latest
    # 40 minutes, up from 25: SAN-1366 split the single 4-query matrix into four independent
    # tests, each with its own home load, so the worst case is longer by design. The wait is a
    # real ceiling rather than a hidden one — a red vertical no longer aborts the other three.
    timeout-minutes: 40
    if: ${{ vars.PROD_SMOKE_ENABLED == 'true' && (github.event_name != 'repository_dispatch' || github.event.client_payload.environment == 'production') }}

    steps:
      - name: Checkout deployed commit
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: vercel/repository-dispatch/actions/checkout@30f760c6640485cd92f8c785ef361382555fb712 # v1

      - name: Checkout main
        if: ${{ github.event_name != 'repository_dispatch' }}
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Validate prod smoke config
        env:
          PROD_SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
        run: |
          if [ -z "${PROD_SMOKE_BASE_URL}" ]; then
            echo "::error::Repository variable PROD_SMOKE_BASE_URL is required (e.g. https://www.mdeai.co)"
            exit 1
          fi

      - name: Verify production runtime contract
        env:
          PROD_SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
        run: |
          set -euo pipefail
          for path in / /events; do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "${PROD_SMOKE_BASE_URL}${path}")
            test "$code" = "200" || { echo "::error::${path} returned ${code}, expected 200"; exit 1; }
          done
          # /api/copilotkit/info is authorization-gated (SAN-1358 / D20). Every
          # request without a valid credential is rejected before CopilotKit/AG-UI
          # runs, so the only unauthenticated contract left to assert is rejection:
          #   1. GET  -> 401. This is no longer 405 with Allow: POST, because the
          #              catch-all route applies authorization to GET as well.
          #   2. POST -> 401, and the body must not carry an agent inventory.
          #
          # Both assertions were verified against production on 2026-09-26; the
          # previous 405/200 expectations described the pre-D20 build and would now
          # fail on every run.
          #
          # Note the coverage change: the CopilotKit version + registered-agent proof
          # that used to live here depended on an unauthenticated 200. It now needs an
          # authenticated session or the service bearer, neither of which this
          # workflow carries, so this step no longer proves the runtime booted. The
          # signed-in route proof below covers authenticated access only.
          for method in GET POST; do
            out="${RUNNER_TEMP}/copilotkit-${method}.json"
            code=$(curl --silent --show-error --location --output "$out" --write-out '%{http_code}' \
              -X "$method" "${PROD_SMOKE_BASE_URL}/api/copilotkit/info" \
              -H "Content-Type: application/json" -d '{"method":"info"}')
            test "$code" = "401" || { echo "::error::${method} /api/copilotkit/info returned ${code}, expected 401 (fail-closed)"; exit 1; }
            if grep -q '"agents"' "$out"; then
              echo "::error::${method} /api/copilotkit/info returned an agent inventory to an unauthenticated caller"
              exit 1
            fi
          done
          echo "copilotkit info: unauthenticated GET and POST both rejected with 401 and no agent inventory"

      - name: Run prod synthetic smoke
        env:
          PROD_SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
          SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
          PROD_SMOKE_OUT_DIR: ${{ github.workspace }}/tmp/prod-synthetic-smoke
          PW_SKIP_WEBSERVER: "1"
        run: npm run test:e2e:prod-synthetic

      - name: Run full production journey on manual certification
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PROD_SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
          PW_SKIP_WEBSERVER: "1"
        run: npm run test:e2e:prod-journey-j05-j20

      # SAN-1314 — live signed-in proof. Runs even when the concierge synthetic
      # smoke above fails, because a broken map panel must not hide whether
      # authenticated users can still reach protected routes.
      #
      # SAN-547 — the isolation proof runs here too. Besides proving that one user
      # cannot read another's thread, it is the only check that asserts a real
      # signed-in turn actually *persists* durable memory: it fails if
      # mastra_threads gains no row owned by the caller. A production AI-memory
      # outage is otherwise invisible, because the app still streams a 200 while
      # every write fails.
      - name: Verify signed-out and signed-in protected route behavior
        if: always()
        env:
          PROD_SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PW_SKIP_WEBSERVER: "1"
        run: |
          npx playwright test \
            e2e/prod-signed-in-route.spec.ts \
            e2e/prod-copilotkit-isolation.spec.ts \
            --project=prod-smoke --workers=1

      # SAN-1367 — **Marketplace Health**: live inventory is a business-state observation, not a
      # runtime claim. It is reported separately, on the existing reporting path (step summary),
      # and can never fail this job. `continue-on-error` plus `exit 0` on every branch means an
      # outage here is invisible, which is correct: this signal does not gate a release.
      - name: Observe Marketplace Health
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Marketplace Health: unavailable (Supabase read credentials are not configured)"
            exit 0
          fi

          # Extracts the exact count PostgREST reports in `Content-Range: 0-0/<total>`.
          #
          # The key matters and is a required argument. The anon key is subject to RLS, so an anon
          # "apartments total" is really "rows this consumer can see" — measured at 0 on
          # 2026-09-29 while the table held 4 rows. Reporting that as "total" would be exactly the
          # kind of overclaiming this pair of tasks exists to remove, so the true table size is read
          # with the service role and the consumer-visible figure is read with the anon key.
          count() {
            curl --silent --show-error --output /dev/null --dump-header - \
              -H "apikey: $1" \
              -H "Authorization: Bearer $1" \
              -H "Prefer: count=exact" \
              -H "Range: 0-0" \
              "${SUPABASE_URL}/rest/v1/$2?select=id$3" \
              | tr -d '\r' \
              | awk 'tolower($1) == "content-range:" { split($2, a, "/"); print a[2] }'
          }

          anon="${SUPABASE_ANON_KEY}"
          svc="${SUPABASE_SERVICE_ROLE_KEY:-}"
          if [ -n "$svc" ]; then
            rentals_total=$(count "$svc" "apartments" "")
          else
            rentals_total="unavailable (service role not configured)"
          fi
          # Anon + RLS: what a renter can actually reach.
          rentals_visible=$(count "$anon" "apartments" "&status=eq.active")
          rentals_requestable=$(count "$anon" "apartments" "&status=eq.active&moderation_status=eq.approved&listing_workflow_status=eq.published")
          # SAN-1366 production run found 59 of 65 published events already in the past, which is
          # why "salsa events this weekend" legitimately renders the events empty state. Stale
          # inventory is a business-state fact, so it belongs here and not in the runtime smoke.
          if [ -n "$svc" ]; then
            events_total=$(count "$svc" "events" "")
          else
            events_total="unavailable (service role not configured)"
          fi
          # Anon + RLS: what a consumer can actually reach for upcoming events.
          events_upcoming=$(count "$anon" "events" "&event_start_time=gte.$(date -u +%Y-%m-%dT%H:%M:%SZ)")

          {
            echo "### Marketplace Health"
            echo ""
            echo "Non-blocking observation. An empty marketplace is a valid product state and does not"
            echo "fail Production Runtime Smoke."
            echo ""
            echo "| Metric | Value |"
            echo "| -- | -- |"
            echo "| rentals · rows in table | ${rentals_total:-unknown} |"
            echo "| rentals · renter-visible (anon + RLS, active) | ${rentals_visible:-unknown} |"
            echo "| rentals · requestable-eligible (active + approved + published) | ${rentals_requestable:-unknown} |"
            echo "| events · rows in table | ${events_total:-unknown} |"
            echo "| events · upcoming | ${events_upcoming:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Marketplace Health: rentals rows=${rentals_total:-unknown} renter-visible=${rentals_visible:-unknown} requestable-eligible=${rentals_requestable:-unknown}; events rows=${events_total:-unknown} upcoming=${events_upcoming:-unknown}"
          if [ "${rentals_requestable:-0}" = "0" ]; then
            echo "Marketplace currently has 0 requestable rentals — not an application failure"
          fi
          if [ -n "${events_upcoming:-}" ] && [ "${events_upcoming}" = "0" ]; then
            echo "Marketplace currently has 0 upcoming events — not an application failure"
          fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime-smoke-${{ github.run_id }}
          path: tmp/prod-synthetic-smoke/**
          if-no-files-found: ignore
