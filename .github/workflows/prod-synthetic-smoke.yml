# UX-034 / SAN-322 — nightly synthetic prod smoke (4 verticals + artifacts).
name: Prod synthetic smoke

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prod-smoke:
    name: prod 4-query smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ vars.PROD_SMOKE_ENABLED == 'true' && (github.event_name != 'repository_dispatch' || github.event.client_payload.environment == 'production') }}

    steps:
      - name: Checkout deployed commit
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: vercel/repository-dispatch/actions/checkout@30f760c6640485cd92f8c785ef361382555fb712 # v1

      - name: Checkout main
        if: ${{ github.event_name != 'repository_dispatch' }}
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Validate prod smoke config
        env:
          PROD_SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
        run: |
          if [ -z "${PROD_SMOKE_BASE_URL}" ]; then
            echo "::error::Repository variable PROD_SMOKE_BASE_URL is required (e.g. https://www.mdeai.co)"
            exit 1
          fi

      - name: Verify production runtime contract
        env:
          PROD_SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
        run: |
          set -euo pipefail
          for path in / /events; do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "${PROD_SMOKE_BASE_URL}${path}")
            test "$code" = "200" || { echo "::error::${path} returned ${code}, expected 200"; exit 1; }
          done
          # /api/copilotkit/info is authorization-gated (SAN-1358 / D20). Every
          # request without a valid credential is rejected before CopilotKit/AG-UI
          # runs, so the only unauthenticated contract left to assert is rejection:
          #   1. GET  -> 401. This is no longer 405 with Allow: POST, because the
          #              catch-all route applies authorization to GET as well.
          #   2. POST -> 401, and the body must not carry an agent inventory.
          #
          # Both assertions were verified against production on 2026-09-26; the
          # previous 405/200 expectations described the pre-D20 build and would now
          # fail on every run.
          #
          # Note the coverage change: the CopilotKit version + registered-agent proof
          # that used to live here depended on an unauthenticated 200. It now needs an
          # authenticated session or the service bearer, neither of which this
          # workflow carries, so this step no longer proves the runtime booted. The
          # signed-in route proof below covers authenticated access only.
          for method in GET POST; do
            out="${RUNNER_TEMP}/copilotkit-${method}.json"
            code=$(curl --silent --show-error --location --output "$out" --write-out '%{http_code}' \
              -X "$method" "${PROD_SMOKE_BASE_URL}/api/copilotkit/info" \
              -H "Content-Type: application/json" -d '{"method":"info"}')
            test "$code" = "401" || { echo "::error::${method} /api/copilotkit/info returned ${code}, expected 401 (fail-closed)"; exit 1; }
            if grep -q '"agents"' "$out"; then
              echo "::error::${method} /api/copilotkit/info returned an agent inventory to an unauthenticated caller"
              exit 1
            fi
          done
          echo "copilotkit info: unauthenticated GET and POST both rejected with 401 and no agent inventory"

      - name: Run prod synthetic smoke
        env:
          PROD_SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
          SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
          PROD_SMOKE_OUT_DIR: ${{ github.workspace }}/tmp/prod-synthetic-smoke
          PW_SKIP_WEBSERVER: "1"
        run: npm run test:e2e:prod-synthetic

      - name: Run full production journey on manual certification
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PROD_SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
          PW_SKIP_WEBSERVER: "1"
        run: npm run test:e2e:prod-journey-j05-j20

      # SAN-1314 — live signed-in proof. Runs even when the concierge synthetic
      # smoke above fails, because a broken map panel must not hide whether
      # authenticated users can still reach protected routes.
      #
      # SAN-547 — the isolation proof runs here too. Besides proving that one user
      # cannot read another's thread, it is the only check that asserts a real
      # signed-in turn actually *persists* durable memory: it fails if
      # mastra_threads gains no row owned by the caller. A production AI-memory
      # outage is otherwise invisible, because the app still streams a 200 while
      # every write fails.
      - name: Verify signed-out and signed-in protected route behavior
        if: always()
        env:
          PROD_SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PW_SKIP_WEBSERVER: "1"
        run: |
          npx playwright test \
            e2e/prod-signed-in-route.spec.ts \
            e2e/prod-copilotkit-isolation.spec.ts \
            --project=prod-smoke --workers=1

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-synthetic-smoke-${{ github.run_id }}
          path: tmp/prod-synthetic-smoke/**
          if-no-files-found: ignore
