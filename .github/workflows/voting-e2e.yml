name: Restaurant voting E2E

# SAN-1469: this is the dedicated authenticated voting gate. It FAILS when its configuration
# is missing (the spec runs with SAN1469_VOTE_E2E=required), so a green run always means a real
# ballot was persisted and read back from PostgreSQL — never a skipped test.
#
# It runs on demand, and on pushes to main that touch the voting surface. It deliberately does
# NOT run on pull requests: the job holds production-wide credentials, so PR code must never
# execute with them (see the note on the `on:` block).

on:
  # This job holds production-wide Supabase credentials (service-role bypasses RLS), so it must
  # never execute PULL REQUEST code. A path filter is not an authorization boundary, and an
  # environment approval still runs the checked-out PR with those secrets. Privileged runs are
  # therefore human-triggered, or run on already-merged main.
  # Follow-up: move the test to a dedicated development Supabase project so per-PR runs can return.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/components/restaurants/**"
      - "src/app/restaurants/**"
      - "src/app/api/restaurants/my-vote/**"
      - "src/lib/restaurants/**"
      - "supabase/functions/vote-*/**"
      # Migration-only pushes matter: a change that breaks vote.votes must not reach main
      # without the real ballot journey being exercised at least once.
      - "supabase/migrations/**"
      - "e2e/san-1469-restaurant-vote.spec.ts"
      - "e2e/helpers/auth.ts"
      - ".github/workflows/voting-e2e.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  authenticated-vote:
    name: authenticated restaurant vote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      # Fail (do not skip) when the gate is not configured. The spec adds a second guard.
      - name: Require the voting configuration
        env:
          SAN1469_TEST_RESTAURANT_ID: ${{ secrets.SAN1469_TEST_RESTAURANT_ID }}
          SAN1469_TEST_CONTEST_ID: ${{ secrets.SAN1469_TEST_CONTEST_ID }}
          SAN1469_TEST_ENTITY_ID: ${{ secrets.SAN1469_TEST_ENTITY_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          missing=""
          for v in SAN1469_TEST_RESTAURANT_ID SAN1469_TEST_CONTEST_ID SAN1469_TEST_ENTITY_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required voting gate configuration:$missing"
            exit 1
          fi

      - name: Run the authenticated voting journey
        env:
          NODE_ENV: development
          NEXT_TELEMETRY_DISABLED: 1
          SAN1469_VOTE_E2E: required
          NEXT_PUBLIC_E2E_MOCK_MAPS: "1"
          SAN1469_TEST_RESTAURANT_ID: ${{ secrets.SAN1469_TEST_RESTAURANT_ID }}
          SAN1469_TEST_CONTEST_ID: ${{ secrets.SAN1469_TEST_CONTEST_ID }}
          SAN1469_TEST_ENTITY_ID: ${{ secrets.SAN1469_TEST_ENTITY_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx playwright test e2e/san-1469-restaurant-vote.spec.ts --retries=0

      # Success: ONLY the sanitized screenshots, named explicitly.
      - name: Upload sanitized voting screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voting-screenshots-${{ github.run_id }}
          path: |
            test-results/vote-confirm-390.png
            test-results/vote-receipt-390.png
            test-results/vote-receipt-768.png
            test-results/vote-receipt-1440.png
          if-no-files-found: error
          retention-days: 7

      # Failure: restricted diagnostics. Traces and error contexts can contain authentication
      # data, so they are NOT auto-published; only screenshots plus the HTML report are.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voting-failure-${{ github.run_id }}
          path: |
            test-results/*.png
            tmp/playwright-report/**
          if-no-files-found: ignore
          retention-days: 3