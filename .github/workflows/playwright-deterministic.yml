name: Playwright deterministic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deterministic-chromium:
    name: deterministic chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run deterministic critical journeys
        env:
          NODE_ENV: development
          NEXT_TELEMETRY_DISABLED: 1
          E2E_BYPASS_AUTH: "1"
          NEXT_PUBLIC_E2E_MOCK_MAPS: "1"
          NEXT_PUBLIC_E2E_DETERMINISTIC_CHAT: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          SMOKE_BASE_URL: http://localhost:3002
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run dev:ui:worktree
        run: npm run test:e2e:deterministic

      # SAN-1357: the long-chat virtualization proof is a *permanent* regression, so it must
      # run on every PR. `test:e2e:deterministic` only runs deterministic-critical.spec.ts,
      # so without this step the 500-message proof would exist but silently stop protecting
      # main. The npm script owns its own safe dummy environment and web-server command, so
      # nothing is duplicated here.
      - name: Prove long-chat virtualization
        run: npm run test:e2e:chat-virtualization

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-playwright-${{ github.run_id }}
          path: |
            test-results/**
            tmp/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
