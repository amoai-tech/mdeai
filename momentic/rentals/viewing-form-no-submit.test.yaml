fileType: momentic/test/v2
id: mde-rentals-viewing-form-no-submit
description: "Read-only: renter can open a viewing request form for the correct apartment; do not submit production data."
url: https://www.mdeai.co/rentals?neighborhood=Laureles&beds=2
labels:
  - rentals
  - viewing
  - read-only
retries: 0
steps:
  - assert: "At least one actual two-bedroom Laureles apartment has finished loading in the public Rentals result cards."
  - click: "The first visible Schedule viewing or Request MDE follow-up action on an actual two-bedroom Laureles apartment card. Do not click View original listing or Submit."
  - assert: "The viewing request or MDE follow-up form is visible and refers to the apartment card whose action was clicked, with renter contact and preferred date/time inputs appropriate to this workflow."
  - assert: "The form allows reviewing inputs before any submission. An external-ad follow-up is not presented as a confirmed appointment. No confirmation or booking success has been triggered."
