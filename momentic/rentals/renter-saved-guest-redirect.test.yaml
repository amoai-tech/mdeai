fileType: momentic/test/v2
id: mde-rentals-saved-guest-redirect
description: "Read-only access check: guest cannot read another user's saved renter workspace."
url: https://www.mdeai.co/app/me/saved
labels:
  - rentals
  - renter
  - auth
  - read-only
retries: 0
steps:
  - waitForUrl:
      substring: /login?next=%2Fapp%2Fme%2Fsaved
      timeout: 12000
  - assert: "The login screen is visible and does not expose private saved listings or renter account details. Do not sign in, create data, or submit anything."
